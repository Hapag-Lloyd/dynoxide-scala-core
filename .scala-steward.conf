pullRequests.grouping = [
  {
    name = "scala-version"
    title = "chore: update Scala version"
    filter = [{ group = "org.scala-lang" }]
  }
]

updatePullRequests = "always"

updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "2.12." },
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "2.13." },
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3." }
]

updates.cooldown.minimumAge = "3 days" # take at lest 3 days matured releases

# Skip specific known-broken releases outright (their existing PR gets closed).
# Uncomment and fill in when a bad release actually happens, e.g.:
# updates.retracted = [
#   {
#     reason = "Broken compatibility, see linked discussion",
#     doc = "https://example.com/issue",
#     artifacts = [
#       { groupId = "org.scala-lang", artifactId = "scala3-compiler", version = { exact = "3.6.0" } }
#     ]
#   }
# ]

# Slow down updates for specific risky/flaky dependencies (longer cooldown/frequency
# than the global default) without affecting everything else. Uncomment as needed, e.g.:
# dependencyOverrides = [
#   {
#     dependency = { groupId = "com.example", artifactId = "risky-lib" },
#     pullRequests = { frequency = "30 days" },
#     cooldown = { minimumAge = "14 days" },
#   }
# ]

pullRequests.customLabels = [ "dependencies" ]

commits.message = "chore: update ${artifactName} to ${nextVersion}"
