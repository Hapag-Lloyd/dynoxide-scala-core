name: Scala Steward

# This workflow will launch everyday at 00:00
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scala-steward:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Scala Steward
    steps:
      - name: Check that the organization app credentials are available
        env:
          APP_ID: ${{ vars.GET_TOKEN_APP_ID }}
          APP_KEY: ${{ secrets.GET_TOKEN_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$APP_ID" ] && missing="$missing GET_TOKEN_APP_ID(variable)"
          [ -z "$APP_KEY" ] && missing="$missing GET_TOKEN_APP_PRIVATE_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error title=Organization app credentials are not available::Not shared with this repository:$missing."
            exit 1
          fi
      - name: Get organization app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.GET_TOKEN_APP_ID }}
          private-key: ${{ secrets.GET_TOKEN_APP_PRIVATE_KEY }}

      - uses: sbt/setup-sbt@v1

      - name: Scala Steward
        uses: scala-steward-org/scala-steward-action@v2.96.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
